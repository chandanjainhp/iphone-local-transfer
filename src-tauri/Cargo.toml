# The package and lib names stay `local-iphone-transfer` / `local_iphone_transfer_lib`
# through the Mavora rebrand: the crate is an internal identifier, not a
# user-facing name, and renaming it would invalidate the published 0.2.0
# Cargo.lock entry and the binary path the packaging config points at.
[package]
name = "local-iphone-transfer"
version = "0.2.0"
description = "Mavora — local-only iPhone USB media transfer"
authors = ["Mavora contributors"]
edition = "2021"

[lib]
name = "local_iphone_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
filetime = "0.2"

# libc is used only on Unix to convert a device-reported local timestamp back
# into an epoch value (mktime), so source mtimes can be preserved exactly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
